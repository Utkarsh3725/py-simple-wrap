name: Away status on mention

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: away-status-mentions
  cancel-in-progress: false

jobs:
  away-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check if within away window and comment
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Europe/Warsaw handles CET/CEST DST switches automatically —
          # no manual UTC offset math needed.
          day=$(TZ='Europe/Warsaw' date +%u)   # 1=Mon ... 7=Sun
          hour=$(TZ='Europe/Warsaw' date +%H)  # 00-23, local Warsaw time

          # Wed(3) through Sun(7), before 17:00 local time.
          if [ "$day" -ge 3 ] && [ "$day" -le 7 ] && [ "$hour" -lt 17 ]; then
            echo "Within away window (day=$day hour=$hour Warsaw time) — posting comment."
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file .github/ISSUE_TEMPLATE/away_message.md || echo "Read-only fork token cannot post PR comment; skipping."
          else
            echo "Outside away window (day=$day hour=$hour Warsaw time) — skipping."
          fi
